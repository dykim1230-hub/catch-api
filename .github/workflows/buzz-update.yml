name: Weekly buzz update

on:
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 09:00 KST (= 일요일 00:00 UTC, GitHub cron은 UTC만 지원)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Call /cron/update
        env:
          CRON_TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 600 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST -H "X-Cron-Token: $CRON_TOKEN" \
            https://catch-api-xin9.onrender.com/cron/update
