name: Debug Gemini

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /debug/gemini
        env:
          CRON_TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            -X POST -H "X-Cron-Token: $CRON_TOKEN" \
            https://catch-api-xin9.onrender.com/debug/gemini
